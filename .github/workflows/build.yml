name: Native Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure C11 / x64
        run: cmake -S . -B build-native -A x64
      - name: Build with warnings as errors
        run: cmake --build build-native --config Release
      - name: Read-only validation
        shell: pwsh
        run: ./scripts/validate.ps1 -Binary build-native/bin/Release/win_aio_optimize.exe
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: build-native/validation-*/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: win-aio-optimize-x64
          path: |
            build-native/bin/Release/win_aio_optimize.exe
            build-native/bin/Release/win_aio_optimize.exe.sha256
            install.ps1
